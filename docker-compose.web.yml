version: '3.8'

services:
  streamlink-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: streamlink-web-gui
    restart: unless-stopped
    ports:
      - "80:8080"  # Non-standard port to avoid conflicts
    volumes:
      - ${DOWNLOAD_VOLUME_PATH:-./download}:/app/download
      - ${CONVERTED_VOLUME_PATH:-./converted}:/app/converted  # For converted MP4 files
      - ${DATA_VOLUME_PATH:-./data}:/app/data  # For database persistence
      - ${CONFIG_VOLUME_PATH:-./config}:/app/config  # For persistent configurations
      - ${LOGS_VOLUME_PATH:-./logs}:/app/logs  # For persistent logs
    environment:
      # Web GUI Configuration
      - PORT=8080
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DOWNLOAD_PATH=/app/download
      
      # Twitch API Configuration
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_OAUTH_TOKEN=${TWITCH_OAUTH_TOKEN}
      
      # Notification Configuration (optional)
      - SLACK_ID=${SLACK_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      
      # Additional Configuration
      - GAME_LIST=${GAME_LIST}
    env_file:
      - .env

# FFmpeg is now integrated into the web GUI container
# No standalone FFmpeg container needed
